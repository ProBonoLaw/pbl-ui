name: Deploy Test static UX and AKS API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  release:
    if: github.event.repository.private && github.repository == vars.AZURE_DEPLOYMENT_REPOSITORY
    uses: ./.github/workflows/release.yml
    with:
      environment: Test
    secrets: inherit
